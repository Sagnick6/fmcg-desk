<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Staples &amp; Screens · Daily desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#F1F4F2; --panel:#FAFBFA; --ink:#15222B; --muted:#5B6A72; --rule:#D2DAD7;
  --up:#0E7A4D; --down:#B3261E; --accent:#B7791F; --chart:#1F4E5F; --chart-fill:rgba(31,78,95,.10);
  --serif:'Newsreader',Georgia,'Times New Roman',serif;
  --sans:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--ground:#0F171C; --panel:#152128; --ink:#E7EEF0; --muted:#93A4AC; --rule:#25353D;
    --up:#3CC98B; --down:#F27D72; --accent:#E3A93B; --chart:#7FC3D8; --chart-fill:rgba(127,195,216,.12);}
}
*{box-sizing:border-box}
html{scroll-padding-top:12px}
body{margin:0;background:var(--ground);color:var(--ink);font:400 15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.num{font-variant-numeric:tabular-nums lining-nums}
.up{color:var(--up)} .down{color:var(--down)}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:22px 0 14px;border-bottom:1px solid var(--rule)}
header.top h1{font:500 22px/1.1 var(--serif);margin:0;letter-spacing:-.01em}
.meta{display:flex;gap:14px;align-items:center;color:var(--muted);font-size:13px;flex-wrap:wrap}
select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--rule);border-radius:4px;padding:4px 8px}
.banner{background:var(--accent);color:#1b1200;padding:8px 24px;font-size:13px;text-align:center}

/* hero */
.hero{display:grid;grid-template-columns:minmax(240px,320px) 1fr;gap:40px;padding:34px 0 30px;border-bottom:1px solid var(--rule)}
.hero .label{color:var(--muted);font-size:14px}
.hero .big{font:500 clamp(44px,7vw,68px)/1 var(--serif);letter-spacing:-.02em;margin:6px 0 8px}
.hero .delta{font-size:18px;font-weight:500}
.hero dl{display:grid;grid-template-columns:auto 1fr;gap:4px 18px;margin:22px 0 0;font-size:13px}
.hero dt{color:var(--muted)} .hero dd{margin:0;text-align:right}
.chartbox{position:relative;align-self:center}
.chartbox svg{width:100%;height:auto;display:block;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--ground);font-size:12px;padding:4px 8px;border-radius:3px;white-space:nowrap;transform:translate(-50%,-130%);display:none}

/* report + costs */
.duo{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,1fr);gap:56px;padding:34px 0;border-bottom:1px solid var(--rule)}
h2{font:500 20px/1.2 var(--serif);margin:0 0 14px;letter-spacing:-.005em}
.report h3{font:600 14px/1.3 var(--sans);margin:22px 0 4px}
.report p{font:400 17px/1.62 var(--serif);margin:0;max-width:66ch}
.report .headline{font:500 26px/1.2 var(--serif);margin:0 0 6px;letter-spacing:-.01em}
.report .by{color:var(--muted);font-size:12px;margin-top:22px}
.costs .row{display:grid;grid-template-columns:1fr auto 78px;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--rule)}
.costs .row:last-child{border-bottom:0}
.costs .nm{font-weight:500}
.costs .sub{color:var(--muted);font-size:12px}
.costs .px{text-align:right;font-size:14px}
.costs .px small{display:block;font-size:12px}
.costs .na{color:var(--muted);font-size:12px;grid-column:2/4;text-align:right}
svg.spark{width:78px;height:26px;display:block}

/* tables */
section.block{padding:34px 0;border-bottom:1px solid var(--rule)}
.tables{display:grid;grid-template-columns:1fr 1fr;gap:48px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-weight:500;color:var(--muted);text-align:right;padding:6px 8px;border-bottom:1px solid var(--ink);cursor:pointer;user-select:none;white-space:nowrap;font-size:12.5px}
th:first-child,td:first-child{text-align:left;padding-left:0}
th[aria-sort]::after{content:attr(data-arrow);margin-left:4px}
td{padding:8px;text-align:right;border-bottom:1px solid var(--rule)}
td:first-child{font-weight:500}
td .tk{display:block;color:var(--muted);font-weight:400;font-size:11.5px}
td.sp{width:84px;padding-right:0}

/* news */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
.chip{font:inherit;font-size:13px;border:1px solid var(--rule);background:transparent;color:var(--ink);padding:3px 11px;border-radius:99px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.news li{list-style:none;display:grid;grid-template-columns:1fr auto;gap:4px 20px;padding:11px 0;border-bottom:1px solid var(--rule)}
.news ul{margin:0;padding:0}
.news a{text-decoration:none;font-weight:500}
.news a:hover{text-decoration:underline}
.news .src{color:var(--muted);font-size:12.5px}
.news .tg{color:var(--muted);font-size:12.5px;text-align:right;grid-row:1/3;grid-column:2;align-self:center}
.empty{color:var(--muted)}

footer{padding:26px 0 48px;color:var(--muted);font-size:12.5px;max-width:80ch}

@media (max-width:860px){
  .hero{grid-template-columns:1fr;gap:20px}
  .duo{grid-template-columns:1fr;gap:34px}
  .tables{grid-template-columns:1fr;gap:34px}
  .news .tg{display:none}
  td.sp,th.sp{display:none}
  .wrap{padding:0 16px}
}
@media (prefers-reduced-motion:no-preference){
  .hero .big{animation:rise .5s ease-out both}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
}
</style>
</head>
<body>
<div id="banner"></div>
<div class="wrap">
  <header class="top">
    <h1>Staples &amp; Screens</h1>
    <div class="meta">
      <span id="asof">Loading…</span>
      <label id="archiveWrap" hidden>Day <select id="archive"></select></label>
    </div>
  </header>

  <div id="app" aria-live="polite"></div>

  <footer>
    Prices come from Yahoo Finance and are typically delayed; headlines come from Google News and publisher RSS feeds.
    The report is generated automatically from the numbers and headlines above. This page is for information, not investment advice.
    <span id="health"></span>
  </footer>
</div>

<script>
const $ = (s, r=document) => r.querySelector(s);
const fmt = (n, d=2) => n == null ? '–' : n.toLocaleString('en-IN', {minimumFractionDigits:d, maximumFractionDigits:d});
const pct = n => n == null ? '–' : (n >= 0 ? '+' : '') + n.toFixed(2) + '%';
const cls = n => n == null ? '' : n >= 0 ? 'up' : 'down';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function spark(vals, up){
  if(!vals || vals.length < 2) return '';
  const w=78,h=26,min=Math.min(...vals),max=Math.max(...vals),r=(max-min)||1;
  const pts = vals.map((v,i)=>[(i/(vals.length-1))*w, h-2-((v-min)/r)*(h-4)]);
  const d = pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join('');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${d}" fill="none" stroke="var(--${up?'up':'down'})" stroke-width="1.5" stroke-linejoin="round"/></svg>`;
}

function bigChart(container, vals, dates){
  const W=760,H=240,pl=8,pr=52,pt=10,pb=22;
  const min=Math.min(...vals),max=Math.max(...vals),pad=(max-min)*.08||1,lo=min-pad,hi=max+pad;
  const x=i=>pl+(i/(vals.length-1))*(W-pl-pr), y=v=>pt+(1-(v-lo)/(hi-lo))*(H-pt-pb);
  const line=vals.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join('');
  const area=line+`L${x(vals.length-1)} ${H-pb}L${x(0)} ${H-pb}Z`;
  const ticks=[lo+(hi-lo)*.15, (lo+hi)/2, hi-(hi-lo)*.15];
  let g=ticks.map(t=>`<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--rule)" stroke-dasharray="2 4"/><text x="${W-pr+6}" y="${y(t)+4}" font-size="11" fill="var(--muted)">${fmt(t,0)}</text>`).join('');
  const dl=[0,Math.floor(vals.length/2),vals.length-1].map((i,k)=>`<text x="${x(i)}" y="${H-4}" font-size="11" fill="var(--muted)" text-anchor="${k==0?'start':k==2?'end':'middle'}">${dates?dates[i].slice(5):''}</text>`).join('');
  container.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Price history, last ${vals.length} sessions">
    ${g}<path d="${area}" fill="var(--chart-fill)"/><path d="${line}" fill="none" stroke="var(--chart)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
    <circle id="dot" r="4" fill="var(--chart)" cx="${x(vals.length-1)}" cy="${y(vals[vals.length-1])}"/>${dl}</svg><div class="tip"></div>`;
  const svg=$('svg',container), tip=$('.tip',container), dot=$('#dot',container);
  svg.addEventListener('pointermove',e=>{
    const b=svg.getBoundingClientRect(), px=(e.clientX-b.left)/b.width*W;
    const i=Math.max(0,Math.min(vals.length-1,Math.round((px-pl)/(W-pl-pr)*(vals.length-1))));
    dot.setAttribute('cx',x(i)); dot.setAttribute('cy',y(vals[i]));
    tip.style.display='block'; tip.style.left=(x(i)/W*b.width)+'px'; tip.style.top=(y(vals[i])/H*b.height)+'px';
    tip.textContent=(dates?dates[i]+' · ':'')+fmt(vals[i]);
  });
  svg.addEventListener('pointerleave',()=>{tip.style.display='none';dot.setAttribute('cx',x(vals.length-1));dot.setAttribute('cy',y(vals[vals.length-1]));});
}

function heroHTML(d){
  const i=d.index;
  if(!i) return `<div class="hero"><div><p class="empty">Nifty FMCG data was unavailable in this update. The engine will retry at the next scheduled run.</p></div></div>`;
  const b=d.benchmark;
  return `<div class="hero"><div>
    <div class="label">Nifty FMCG${i.live?' (live, market open)':''}</div>
    <div class="big num">${fmt(i.price)}</div>
    <div class="delta num ${cls(i.change)}">${i.change>=0?'+':''}${fmt(i.change)} (${pct(i.change_pct)})</div>
    <dl class="num">
      <dt>1 week</dt><dd class="${cls(i.chg_1w_pct)}">${pct(i.chg_1w_pct)}</dd>
      <dt>1 month</dt><dd class="${cls(i.chg_1m_pct)}">${pct(i.chg_1m_pct)}</dd>
      <dt>52-week range</dt><dd>${fmt(i.low_52w,0)} – ${fmt(i.high_52w,0)}</dd>
      ${b?`<dt>Nifty 50 today</dt><dd class="${cls(b.change_pct)}">${pct(b.change_pct)}</dd>`:''}
    </dl></div><div class="chartbox" id="chart"></div></div>`;
}

function reportHTML(r){
  if(!r) return '<p class="empty">No report for this day.</p>';
  return `<div class="report"><h2>Today’s note</h2><p class="headline">${esc(r.headline)}</p>
    ${r.sections.map(s=>`<h3>${esc(s.title)}</h3><p>${esc(s.body)}</p>`).join('')}
    <div class="by">Written by ${esc(r.generated_by)}</div></div>`;
}

function costsHTML(list){
  return `<div class="costs"><h2>Input costs</h2>${list.map(c=>{
    if(!c.available) return `<div class="row"><div><div class="nm">${esc(c.name)}</div><div class="sub">${esc(c.unit)}</div></div><div class="na">No data source yet. Add prices to manual_prices.csv.</div></div>`;
    return `<div class="row" title="Affects: ${esc(c.exposure)}"><div><div class="nm">${esc(c.name)}</div><div class="sub">${esc(c.unit)}</div></div>
      <div class="px num">${fmt(c.price)}<small class="${cls(c.change_pct)}">${pct(c.change_pct)}</small></div>${spark(c.history,c.change_pct>=0)}</div>`}).join('')}</div>`;
}

const sortState={};
function tableHTML(id,title,rows){
  const st=sortState[id]||(sortState[id]={k:'change_pct',dir:-1});
  rows=[...rows].sort((a,b)=>st.dir*((a[st.k]??-1e9)-(b[st.k]??-1e9)));
  const th=(k,l,c='')=>`<th class="${c}" data-k="${k}" data-t="${id}" ${st.k===k?`aria-sort="${st.dir>0?'ascending':'descending'}" data-arrow="${st.dir>0?'↑':'↓'}"`:''} tabindex="0">${l}</th>`;
  return `<div><h2>${title}</h2><table class="num"><thead><tr><th style="text-align:left;cursor:default">Company</th>${th('price','Price')}${th('change_pct','1D')}${th('chg_1w_pct','1W')}${th('chg_1m_pct','1M')}<th class="sp" style="cursor:default"></th></tr></thead><tbody>
  ${rows.map(s=>`<tr><td>${esc(s.name)}<span class="tk">${esc(s.symbol.replace('.NS',''))}</span></td><td>${fmt(s.price)}</td>
   <td class="${cls(s.change_pct)}">${pct(s.change_pct)}</td><td class="${cls(s.chg_1w_pct)}">${pct(s.chg_1w_pct)}</td><td class="${cls(s.chg_1m_pct)}">${pct(s.chg_1m_pct)}</td>
   <td class="sp">${spark(s.history,s.chg_1m_pct>=0)}</td></tr>`).join('')}</tbody></table></div>`;
}

function ago(iso){
  const m=Math.max(1,Math.round((Date.now()-new Date(iso))/60000));
  return m<60?`${m} min ago`:m<1440?`${Math.round(m/60)} h ago`:`${Math.round(m/1440)} d ago`;
}

let DATA=null, TAG='All';
function newsHTML(){
  const all=DATA.news, tags=[...new Set(all.flatMap(n=>n.tags))].sort();
  const items=all.filter(n=>TAG==='All'||n.tags.includes(TAG));
  return `<h2>Headlines</h2><div class="chips" role="group" aria-label="Filter headlines">${['All',...tags].map(t=>`<button class="chip" data-tag="${esc(t)}" aria-pressed="${t===TAG}">${esc(t)}</button>`).join('')}</div>
  <ul>${items.length?items.map(n=>`<li><a href="${esc(n.link)}" target="_blank" rel="noopener">${esc(n.title)}</a><span class="tg">${esc(n.tags.join(', '))}</span><span class="src">${esc(n.source)} · ${ago(n.published)}</span></li>`).join(''):'<li class="empty">No headlines match this filter.</li>'}</ul>`;
}

function render(){
  const d=DATA, app=$('#app');
  $('#banner').innerHTML=d.demo?'<div class="banner">Preview with synthetic numbers. Run the engine to see real data.</div>':'';
  $('#asof').textContent=`${d.snapshot||''}${d.snapshot?' · ':''}Latest session ${d.as_of} · updated ${new Date(d.generated_at).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'})}`;
  app.innerHTML=heroHTML(d)+
    `<div class="duo"><div>${reportHTML(d.report)}</div><div>${costsHTML(d.commodities)}</div></div>`+
    `<section class="block"><div class="tables">${tableHTML('fmcg','Consumer staples',d.stocks.filter(s=>s.group==='FMCG'))}${tableHTML('net','Internet and new-age consumer',d.stocks.filter(s=>s.group==='Internet'))}</div></section>`+
    `<section class="block news" id="news">${newsHTML()}</section>`;
  if(d.index) bigChart($('#chart'),d.index.history,d.index.dates);
  const h=d.health; $('#health').textContent=h?` Last run: ${h.stocks_ok} stocks, ${h.commodities_ok}/${h.commodities_total} commodities, ${h.news_items} headlines.`:'';
}

document.addEventListener('click',e=>{
  const chip=e.target.closest('.chip'); if(chip){TAG=chip.dataset.tag; $('#news').innerHTML=newsHTML(); return;}
  const th=e.target.closest('th[data-k]'); if(th){const st=sortState[th.dataset.t]; st.dir=st.k===th.dataset.k?-st.dir:-1; st.k=th.dataset.k; const y=scrollY; render(); scrollTo(0,y);}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('th[data-k]'))e.target.click();});

async function load(url){
  try{
    const r=await fetch(url,{cache:'no-cache'}); if(!r.ok) throw new Error(r.status);
    DATA=await r.json(); TAG='All'; render();
  }catch(err){
    $('#app').innerHTML=`<p class="empty" style="padding:40px 0">Could not load ${esc(url)}. If you opened this file directly, serve the folder instead: run <code>python -m http.server</code> inside the site folder and open localhost:8000.</p>`;
    $('#asof').textContent='No data';
  }
}
(async()=>{
  await load('data/latest.json');
  try{
    const r=await fetch('data/archive/index.json'); if(!r.ok) return;
    const days=await r.json(); if(!days.length) return;
    const sel=$('#archive'); sel.innerHTML='<option value="latest">Latest</option>'+days.map(d=>`<option value="${d}">${d}</option>`).join('');
    $('#archiveWrap').hidden=false;
    sel.addEventListener('change',()=>load(sel.value==='latest'?'data/latest.json':`data/archive/${sel.value}.json`));
  }catch(e){}
})();
</script>
</body>
</html>
